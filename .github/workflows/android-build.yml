name: Android Build

on:
  push:
    branches: [ "main", "ci/gradle-wrapper-build" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Commit generated Gradle Wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci/gradle-wrapper-build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper is already committed."
          else
            git commit -m "build: add Gradle Wrapper"
            git push origin HEAD:ci/gradle-wrapper-build
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: productivity-pro-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: productivity-pro-release
          path: app/build/outputs/apk/release/*.apk
